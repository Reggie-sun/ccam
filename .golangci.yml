version: "2"
linters:
  settings:
    errcheck:
      # Writes to stdout/stderr and best-effort cleanup are not worth checking.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000", "-ST1003", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    rules:
      # Test setup ignores errors on purpose; failures show up as assertions.
      - path: _test\.go
        linters: [errcheck]
