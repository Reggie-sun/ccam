# Register and conventions per language. Translators: match the tone of good
# developer documentation in that language (e.g. MDN, Microsoft Learn, GitHub Docs).
default: Plain, direct, friendly developer documentation. Short sentences. No marketing tone.
en: Source language.
zh-hans: 简体中文，技术文档语气，用"你"。中英文之间加空格。
