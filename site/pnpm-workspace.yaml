# esbuild (bundles the Worker) and workerd (wrangler dev) download platform binaries on install.
allowBuilds:
  esbuild: true
  workerd: true
# fflate < 0.7.5 can loop forever on malformed ZIP64 (Dependabot alert); satori pins 0.7.3.
# undici < 7.30.1 can crash on too many content-encodings (Dependabot alert); miniflare pins 7.29.1.
overrides:
  fflate: ^0.8.2
  undici: ^7.30.1
