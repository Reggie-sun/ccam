version: 2
project_name: ccam

builds:
  - main: ./cmd/ccam
    binary: ccam
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/jhyunwoo/ccam/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "ccam_{{ .Os }}_{{ .Arch }}"
    files: [README.md, README.en.md]

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: ccam
    homepage: https://github.com/jhyunwoo/ccam
    maintainer: jhyunwoo <jhyunwoo@users.noreply.github.com>
    description: Claude Code multi-account manager
    formats: [deb]
    bindir: /usr/bin

changelog:
  use: git

release:
  # ccam.dev/install.sh serves the copy attached to the latest release.
  extra_files:
    - glob: ./install.sh
  github:
    owner: jhyunwoo
    name: ccam
