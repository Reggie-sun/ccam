version: 2
project_name: ccam

builds:
  - main: ./cmd/ccam
    binary: ccam
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/jhyunwoo/ccam/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    # Windows gets a .zip with ccam.exe (install.ps1, ccam update).
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ccam_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, README.ko.md]

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: ccam
    homepage: https://github.com/jhyunwoo/ccam
    maintainer: jhyunwoo <jhyunwoo@users.noreply.github.com>
    description: Claude Code multi-account manager
    license: MIT
    formats: [deb]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/ccam/copyright

changelog:
  use: git
  # Release notes list what changed in ccam, without commit hashes; ccam.dev
  # shows the same list (site/scripts/changelog.ts).
  format: "{{ .Message }}"
  filters:
    exclude:
      - '^(test|chore|ci|docs|build|refactor|style)[:(!]'
      - '^\w+\(site\)'

release:
  # ccam.dev/install.sh and install.ps1 serve the copies attached to the latest release.
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
  github:
    owner: jhyunwoo
    name: ccam
