name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Other Linux distributions, including musl (Alpine). The binary is
  # static, but the tests also exercise each distro's shell and coreutils.
  distro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: golang:1.26-bookworm
            setup: "true"
          - name: alpine
            image: golang:1.26-alpine
            setup: "true"
          - name: fedora
            image: fedora:latest
            setup: dnf install -y golang tar gzip
          - name: arch
            image: archlinux:latest
            setup: pacman -Sy --noconfirm go
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.setup }}
      - run: go test ./...

  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y hyperfine
      - name: Launch path targets (PLAN.md)
        run: scripts/perf-check.sh
      - name: Benchmark regression vs base branch
        if: github.event_name == 'pull_request'
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          scripts/bench-compare.sh origin/${{ github.base_ref }}
